# HIMURA SWITCH PS4 — R11 upper toolbar (CircleCI only) (CircleCI only)
# Branch isolation preserves R08, R07 and all PS2 projects.
version: 2.1
jobs:
  validar_r11_antes_do_pkg:
    docker:
      - image: ubuntu:26.04
    resource_class: medium
    steps:
      - run:
          name: Preparar Git e ferramentas antes do checkout
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ca-certificates git openssh-client curl python3 python3-pil g++ zlib1g-dev
      - checkout
      - run:
          name: Validar R13 PS4 Vulkan e interface antes da compilacao
          command: |
            python3 -m py_compile ci/patch-r11-samurai-library.py
            python3 -m py_compile ci/patch-r13-usb-browser.py
            python3 -m py_compile ci/patch-r13-usb-ptbr.py
            python3 - \<<'PY'
            from pathlib import Path
            s = Path("ci/patch-r11-samurai-library.py").read_text()
            assert 'c.Text("SWITCH PS4  |  R13"' in s, "Versao visual incorreta"
            assert 'c.FillRoundRect(72, 350, 1780, 440' not in s, "Painel preto voltou"
            assert 'c.StrokeRoundRect(72, 350, 1780, 440' not in s, "Borda do painel voltou"
            assert 'R11NeonCover(canvas, left, TileTop, TileSize, st.time)' in s, "Neon ausente"
            print("R13: verificacoes estaticas da interface aprovadas")
            PY
      - run:
          name: Testar codigo R11, menu, FPS, capas, arte e receita PKG
          no_output_timeout: 10m
          command: bash ci/r11-preflight.sh
  compilar_eden4_pkg_r11:
    docker:
      - image: ubuntu:26.04
    resource_class: medium
    steps:
      - run:
          name: Preparar ferramentas de checkout
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ca-certificates git curl openssh-client python3
      - checkout
      - restore_cache:
          keys:
            - r11-ps4-deps-v1-eden-fab246c-llvm2116-mesa2608-orbis106
      - run:
          name: Verificar scripts e menu superior R11
          command: |
            bash -n ci/build-r11-samurai-library.sh
            bash -n ci/build-r08-eden4-pkg.sh
            python3 -m py_compile ci/patch-r10-boot-trace.py
            python3 -m py_compile ci/patch-r10-switch-toolbar.py
            python3 -m py_compile ci/patch-r11-samurai-library.py
            python3 -m py_compile ci/patch-r13-usb-browser.py
            python3 -m py_compile ci/patch-r13-usb-ptbr.py
            python3 -m py_compile ci/patch-r11-theme-cache.py
            python3 -m py_compile ci/patch-r11-autocovers.py
            python3 -m py_compile ci/patch-r11-fps.py
            python3 -m py_compile ci/generate-r11-branding.py
            python3 -m py_compile ci/patch-r11-authorship.py
            python3 -m py_compile ci/patch-r11-stability.py
            python3 -m py_compile ci/patch-r11-approved-menu.py
            python3 -m py_compile ci/patch-r11-home-return.py
            python3 -m py_compile ci/patch-r11-videoout-visibility.py
            python3 -m py_compile ci/patch-r11-build-cache.py
            python3 -m py_compile ci/patch-r12-active-user-videoout.py
            python3 -m py_compile ci/patch-eden4-credits.py
            python3 -m py_compile ci/restore-r08-audio.py
            python3 -m py_compile ci/patch-r08-ffmpeg-link.py
            python3 -m py_compile ci/patch-r08-ffmpeg-linker-shim.py
      - run:
          name: Instalar LLVM21 e dependencias do PS4
          no_output_timeout: 25m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y -qq build-essential clang-21 lld-21 llvm-21 \
              llvm-21-dev libclang-rt-21-dev cmake ninja-build make nasm \
              autoconf automake libtool pkg-config git curl patch xz-utils \
              zstd python3 python3-pil python3-venv python3-mako python3-yaml \
              meson glslang-tools libdrm-dev libxml2-16 unzip \
              libssl-dev zlib1g-dev
            clang-21 --version | head -1
      - run:
          name: Preparar dependências e conferir o cache PS4
          no_output_timeout: 45m
          command: |
            export JOBS=2
            R11_DEPS_ONLY=1 bash ci/build-r11-samurai-library.sh
      - save_cache:
          key: r11-ps4-deps-v1-eden-fab246c-llvm2116-mesa2608-orbis106
          paths:
            - /opt/pacbrew/ps4
            - .himura-r11-build/sysroot
            - .himura-r11-build/src/llvm-project-21.1.6.src
            - .himura-r11-build/src/mesa-26.0.8.tar.xz
            - .himura-r11-build/src/mesa
            - .himura-r11-build/src/libdrm
            - .himura-r11-build/build/mesa
      - run:
          name: Compilar o emulador e gerar o PKG com as dependências preparadas
          no_output_timeout: 45m
          command: |
            export JOBS=2
            R11_PKG_ONLY=1 bash ci/build-r11-samurai-library.sh
      - store_artifacts:
          path: switch-r11-reports
          destination: switch-r11-reports
      - store_artifacts:
          path: switch-r11-pkgs
          destination: switch-r11-pkgs

workflows:
  compilar_menu_superior_r11:
    jobs:
      - validar_r11_antes_do_pkg:
          filters:
            branches:
              only:
                - himura-switch-r11-samurai-library
                - himura-switch-r11-performance-staging
                - himura-switch-r11-approved-art
                - himura-switch-r11-art-and-home
                - himura-switch-r11-videoout-cache-fix
                - himura-switch-r12-active-user-videoout
                - himura-switch-r13-stability-staging
                - himura-switch-r13-ps4-radv-safe-probe
                - himura-switch-r13-usb-browser-safe-20261127
                - himura-switch-r13-ptbr-usb-20261127
                - himura-switch-r13-functional-settings-20261127
                - himura-switch-r13-next-pkg-integration-20261127
      - compilar_eden4_pkg_r11:
          requires:
            - validar_r11_antes_do_pkg
          filters:
            branches:
              only:
                - himura-switch-r11-samurai-library
                - himura-switch-r11-art-and-home
                - himura-switch-r11-videoout-cache-fix
                - himura-switch-r12-active-user-videoout
                - himura-switch-r13-stability-staging
                - himura-switch-r13-ps4-radv-safe-probe
                - himura-switch-r13-usb-browser-safe-20261127
                - himura-switch-r13-ptbr-usb-20261127
