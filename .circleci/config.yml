# HIMURA SWITCH PS4 — R11 upper toolbar (CircleCI only) (CircleCI only)
# Branch isolation preserves R08, R07 and all PS2 projects.
version: 2.1
jobs:
  validar_r11_antes_do_pkg:
    docker:
      - image: ubuntu:26.04
    resource_class: medium
    steps:
      - run:
          name: Preparar Git e ferramentas antes do checkout
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ca-certificates git openssh-client curl python3 python3-pil
      - checkout
      - run:
          name: Validar alteracoes visuais R13 antes da compilacao
          command: |
            python3 -m py_compile ci/patch-r11-samurai-library.py
            python3 - \<<'PY'
            from pathlib import Path
            s = Path("ci/patch-r11-samurai-library.py").read_text()
            assert 'c.Text("SWITCH PS4  |  R13"' in s, "Versao visual incorreta"
            assert 'c.FillRoundRect(72, 350, 1780, 440' not in s, "Painel preto voltou"
            assert 'c.StrokeRoundRect(72, 350, 1780, 440' not in s, "Borda do painel voltou"
            assert 'R11NeonCover(canvas, left, TileTop, TileSize, st.time)' in s, "Neon ausente"
            print("R13: verificacoes estaticas da interface aprovadas")
            PY
      - run:
          name: Testar codigo R11, menu, FPS, capas, arte e receita PKG
          no_output_timeout: 10m
          command: bash ci/r11-preflight.sh
  compilar_eden4_pkg_r11:
    docker:
      - image: ubuntu:26.04
    resource_class: medium
    steps:
      - run:
          name: Preparar ferramentas de checkout
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ca-certificates git curl openssh-client python3
      - checkout
      - restore_cache:
          keys:
            - r11-ps4-deps-v1-eden-fab246c-llvm2116-mesa2608-orbis106
      - run:
          name: Verificar scripts e menu superior R11
          command: |
            bash -n ci/build-r11-samurai-library.sh
            bash -n ci/build-r08-eden4-pkg.sh
            python3 -m py_compile ci/patch-r10-boot-trace.py
            python3 -m py_compile ci/patch-r10-switch-toolbar.py
            python3 -m py_compile ci/patch-r11-samurai-library.py
            python3 -m py_compile ci/patch-r11-theme-cache.py
            python3 -m py_compile ci/patch-r11-autocovers.py
            python3 -m py_compile ci/patch-r11-fps.py
            python3 -m py_compile ci/generate-r11-branding.py
            python3 -m py_compile ci/patch-r11-authorship.py
            python3 -m py_compile ci/patch-r11-stability.py
            python3 -m py_compile ci/patch-r11-approved-menu.py
            python3 -m py_compile ci/patch-r11-home-return.py
            python3 -m py_compile ci/patch-r11-videoout-visibility.py
            python3 -m py_compile ci/patch-r11-build-cache.py
            python3 -m py_compile ci/patch-r12-active-user-videoout.py
            python3 -m py_compile ci/patch-eden4-credits.py
            python3 -m py_compile ci/restore-r08-audio.py
            python3 -m py_compile ci/patch-r08-ffmpeg-link.py
            python3 -m py_compile ci/patch-r08-ffmpeg-linker-shim.py
      - run:
          name: Instalar LLVM21 e dependencias do PS4
          no_output_timeout: 25m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y -qq build-essential clang-21 lld-21 llvm-21 \
              llvm-21-dev libclang-rt-21-dev cmake ninja-build make nasm \
              autoconf automake libtool pkg-config git curl patch xz-utils \
              zstd python3 python3-pil python3-venv python3-mako python3-yaml \
              meson glslang-tools libdrm-dev libxml2-16 unzip \
              libssl-dev zlib1g-dev
            clang-21 --version | head -1
      - run:
          name: Preparar dependências e conferir o cache PS4
          no_output_timeout: 45m
          command: |
            export JOBS=2
            R11_DEPS_ONLY=1 bash ci/build-r11-samurai-library.sh
      - save_cache:
          key: r11-ps4-deps-v1-eden-fab246c-llvm2116-mesa2608-orbis106
          paths:
            - /opt/pacbrew/ps4
            - .himura-r11-build/sysroot
            - .himura-r11-build/src/llvm-project-21.1.6.src
            - .himura-r11-build/src/mesa-26.0.8.tar.xz
            - .himura-r11-build/src/mesa
            - .himura-r11-build/src/libdrm
            - .himura-r11-build/build/mesa
      - run:
          name: Compilar o emulador e gerar o PKG com as dependências preparadas
          no_output_timeout: 45m
          command: |
            export JOBS=2
            R11_PKG_ONLY=1 bash ci/build-r11-samurai-library.sh
      - store_artifacts:
          path: switch-r11-reports
          destination: switch-r11-reports
      - store_artifacts:
          path: switch-r11-pkgs
          destination: switch-r11-pkgs

  validar_r14_menu_updates:
    docker:
      - image: ubuntu:24.04
    resource_class: medium
    steps:
      - run:
          name: Preparar fontes e validador de imagens R14
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ca-certificates git openssh-client curl python3 python3-pil g++
      - checkout
      - run:
          name: Validar Orbis 25 de novembro, menu samurai e importacao NSP
          no_output_timeout: 15m
          command: |
            bash ci/r14-preflight.sh

  compilar_r14_orbis_pkg:
    docker:
      - image: ubuntu:24.04
    resource_class: medium
    steps:
      - run:
          name: Preparar compiladores e ferramentas PS4 R14
          no_output_timeout: 20m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ca-certificates git openssh-client curl build-essential \
              clang-18 lld-18 llvm-18 llvm-18-dev cmake ninja-build make gcc g++ \
              nasm autoconf automake libtool pkg-config perl ccache python3 \
              python3-pil python3-mako python3-yaml meson glslang-tools \
              libssl-dev zlib1g-dev libxml2-dev libdrm-dev \
              xz-utils unzip zstd rsync python3-venv
            test -x /usr/lib/llvm-18/bin/clang
      - checkout
      - run:
          name: Verificar fontes oficiais e interface HIMURA antes de compilar
          no_output_timeout: 15m
          command: |
            if [ "$CIRCLE_BRANCH" = "himura-switch-r14-upstream-baseline" ]; then
              bash -n ci/himura-switch-build.sh
              python3 -m py_compile ci/r14-adapt-orbis.py
              echo 'BASELINE: validacao sintatica; frontend original mantido'
            else
              bash ci/r14-preflight.sh
            fi
      - run:
          name: Compilar Orbis Eden de 25-11 e empacotar HIMURA SWITCH PS4 R14
          no_output_timeout: 45m
          command: |
            python3 -m venv /tmp/himura-cmake-r14
            /tmp/himura-cmake-r14/bin/pip install --disable-pip-version-check 'cmake==3.31.10'
            export PATH="/tmp/himura-cmake-r14/bin:$PATH"
            cmake --version
            python3 -c 'import re, subprocess; v=subprocess.check_output(["cmake", "--version"], text=True); m=re.search(r"cmake version (\d+)\.(\d+)", v); assert m and tuple(map(int, m.groups())) >= (3, 31), v'
            export JOBS=2
            bash ci/himura-switch-build.sh
      - store_artifacts:
          path: switch-build-reports
          destination: R14-logs-e-erros
      - store_artifacts:
          path: switch-build-pkgs
          destination: R14-pkg-e-elf

  auditar_r14_orbis_core:
    docker:
      - image: ubuntu:24.04
    resource_class: small
    steps:
      - run:
          name: Preparar ferramentas para auditoria do Orbis Eden
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq ca-certificates git openssh-client
      - checkout
      - run:
          name: Verificar o commit Orbis e 46 patches sem compilar PKG
          no_output_timeout: 10m
          command: bash ci/audit-r14-orbis-base.sh

  auditar_neweden_v15_image0:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: V15 04.89 - validar somente o codigo de pre-empacotamento
          command: |
            python -m py_compile ci/prepare-neweden-v15-image0.py
            python -m py_compile ci/test-v15-image0-stage-gates.py
            python -m py_compile ci/v15-preflight-gp4-from-exact-app0.py
            python -m py_compile ci/test-v15-preflight-gp4-from-exact-app0.py
            python - <<'PY'
            from pathlib import Path
            s = Path("ci/prepare-neweden-v15-image0.py").read_text()
            assert "EDNP00001-app0/" in s
            assert "IMAGE0 EXPERIMENTAL" in s
            assert "NAO EH PKG" in s
            assert "EXPERIMENTAL_EBOOT_SHA" in s
            print("PASS: V15 prepack script is syntactically valid")
            print("INFO: No PKG build/PS4 boot is claimed or performed by this check")
            PY

  validar_neweden_v15_r13_assets:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Instalar Pillow para validar artes R13 do proprio repositorio
          command: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - run:
          name: Verificar capa externa R13 e isolar screenshot com botoes ficticios
          command: |
            python -m py_compile ci/prepare-neweden-v15-r13-art.py
            python -m py_compile ci/test-neweden-v15-r13-art.py
            python ci/test-neweden-v15-r13-art.py
            python ci/prepare-neweden-v15-r13-art.py --assets assets --out /tmp/v15-r13-verified
            mkdir -p v15-r13-artifacts
            cp /tmp/v15-r13-verified/external-ps4/icon0.png v15-r13-artifacts/icon0.png
            cp /tmp/v15-r13-verified/manifest-r13-v15.json v15-r13-artifacts/manifest-r13-v15.json
      - store_artifacts:
          path: v15-r13-artifacts
          destination: V15-R13-capa-externa-SOMENTE

workflows:
  auditar_neweden_v15_prepack:
    jobs:
      - auditar_neweden_v15_image0:
          filters:
            branches:
              only:
                - himura-switch-neweden-0489-pkg-direct
      - validar_neweden_v15_r13_assets:
          filters:
            branches:
              only:
                - himura-switch-neweden-0489-pkg-direct

  compilar_menu_superior_r11:
    jobs:
      - validar_r14_menu_updates:
          filters:
            branches:
              only:
                - himura-switch-r14-orbis-ui-integration
                - himura-switch-r14-libcxx-random-fix
      - compilar_r14_orbis_pkg:
          filters:
            branches:
              only:
                - himura-switch-r14-orbis-build
                - himura-switch-r14-upstream-baseline
      - auditar_r14_orbis_core:
          filters:
            branches:
              only:
                - himura-switch-r14-orbis-core-audit
      - validar_r11_antes_do_pkg:
          filters:
            branches:
              only:
                - himura-switch-r11-samurai-library
                - himura-switch-r11-performance-staging
                - himura-switch-r11-approved-art
                - himura-switch-r11-art-and-home
                - himura-switch-r11-videoout-cache-fix
                - himura-switch-r12-active-user-videoout
                - himura-switch-r13-stability-staging
      - compilar_eden4_pkg_r11:
          requires:
            - validar_r11_antes_do_pkg
          filters:
            branches:
              only:
                - himura-switch-r11-samurai-library
                - himura-switch-r11-art-and-home
                - himura-switch-r11-videoout-cache-fix
                - himura-switch-r12-active-user-videoout
                - himura-switch-r13-stability-staging
